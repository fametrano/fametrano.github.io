{{ define "main" }}
<div class="page-head"><div class="narrow">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
</div></div>
<div class="narrow prose">
  {{ .Content }}
  {{ partial "yearlist.html" (dict "items" (index hugo.Data (.Params.data | default "events")).items "id" "events") }}
  {{ with .Params.archive }}<p>{{ . | markdownify }}</p>{{ end }}
</div>
{{ end }}
