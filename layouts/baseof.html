<!DOCTYPE html>
<html lang="{{ .Params.contentLang | default site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">{{ i18n "skip" }}</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ with resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
</body>
</html>
