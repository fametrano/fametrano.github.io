{{ define "main" }}
<div class="page-head"><div class="narrow">
  <h1>{{ .Title }}</h1>
  <p class="lead">{{ .Description }}</p>
  <div class="btn-row"><a class="btn primary" href="{{ site.Params.contactForm }}">{{ i18n "contactForm" }}</a></div>
</div></div>
<div class="narrow prose">
  {{ .Content }}
  {{- with site.Params.pgpFingerprint }}
  <h2>{{ i18n "pgp" }}</h2>
  <p class="fingerprint">{{ . }}</p>
  {{- end }}
</div>
{{ end }}
